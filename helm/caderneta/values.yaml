image:
  # Published by CI (.github/workflows/ci.yml) on every push to main and on tags.
  # To run the image you built locally: --set image.repository=caderneta
  # --set image.tag=local (or `just deploy -i caderneta -t local`).
  repository: ghcr.io/rafalg18/caderneta
  # Empty = uses v<appVersion> from Chart.yaml (e.g. v0.3.0), which only exists
  # in the registry after a `git tag vX.Y.Z` (a push to main publishes
  # main/sha/latest, not the version).
  # With no release published, use `just deploy -t latest` or the sha tag.
  # Prefer an immutable tag over `latest`: with pullPolicy IfNotPresent,
  # `latest` goes stale on the node.
  tag: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

# WARNING: a polling bot cannot have two replicas. The second one gets
# "409 Conflict: terminated by other getUpdates request" and the two start
# fighting over the updates. The chart fails on purpose if this is > 1.
replicaCount: 1

telegram:
  # Option 1 (recommended): reference a Secret you created outside of Helm, so
  # the token never goes through values.yaml nor through the Helm history.
  #   kubectl create secret generic caderneta-token --from-literal=BOT_TOKEN=...
  existingSecret: ""
  existingSecretKey: BOT_TOKEN

  # Option 2: the chart creates the Secret. Handy for testing, worse for
  # production - the value stays in the Helm release.
  botToken: ""

  # Your chat_id. Empty = bootstrap mode (the bot only reports the caller's id).
  ownerChatId: ""

config:
  tz: America/Recife
  logLevel: INFO
  dbPath: /data/caderneta.db
  healthPort: 8080

persistence:
  enabled: true
  # SQLite requires ReadWriteOnce: it is a file, not a server.
  accessMode: ReadWriteOnce
  size: 1Gi
  storageClass: ""
  # Reuse an existing PVC (useful to restore a backup).
  existingClaim: ""

service:
  type: ClusterIP
  port: 8080

resources:
  requests:
    cpu: 25m
    memory: 64Mi
  limits:
    memory: 256Mi

livenessProbe:
  initialDelaySeconds: 15
  periodSeconds: 30
  timeoutSeconds: 5
  failureThreshold: 3

readinessProbe:
  initialDelaySeconds: 5
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

serviceAccount:
  create: true
  name: ""
  annotations: {}

podAnnotations: {}
podLabels: {}
nodeSelector: {}
tolerations: []
affinity: {}
