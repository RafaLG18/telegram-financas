{{- include "caderneta.validate" . -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "caderneta.fullname" . }}
  labels:
    {{- include "caderneta.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  # Recreate, nao RollingUpdate: o PVC e ReadWriteOnce e dois pods em polling
  # brigariam pelo getUpdates durante o rollout.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "caderneta.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        # Reinicia o pod quando o ConfigMap muda.
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "caderneta.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "caderneta.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: bot
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default (printf "v%s" .Chart.AppVersion) }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          envFrom:
            - configMapRef:
                name: {{ include "caderneta.fullname" . }}
          env:
            - name: BOT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "caderneta.secretName" . }}
                  key: {{ include "caderneta.secretKey" . }}
          ports:
            - name: health
              containerPort: {{ .Values.config.healthPort }}
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            {{- toYaml .Values.livenessProbe | nindent 12 }}
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            {{- toYaml .Values.readinessProbe | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: dados
              mountPath: {{ dir .Values.config.dbPath }}
            # readOnlyRootFilesystem: tudo que precisa escrever ganha volume proprio.
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: dados
        {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "caderneta.pvcName" . }}
        {{- else }}
          emptyDir: {}
        {{- end }}
        - name: tmp
          emptyDir: {}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
