name: caderneta

services:
  bot:
    build:
      context: .
      dockerfile: Dockerfile
    image: caderneta:local
    container_name: caderneta-bot
    restart: unless-stopped
    env_file:
      # Optional so the `scan` and `smoke` profiles can run before a .env
      # exists. Without it, the `bot` service starts and stops with a clear error.
      - path: .env
        required: false
    environment:
      DB_PATH: /data/caderneta.db
      HEALTH_PORT: "8080"
    volumes:
      - caderneta-data:/data
    ports:
      # Loopback only: health does not need to be exposed on the network.
      - "127.0.0.1:8080:8080"
    # The container only writes to /data; the rest of the filesystem can be read-only.
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=3).status==200 else 1)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Vulnerability scan. Does not start on `up` - run it with:
  #   docker compose --profile scan run --rm trivy
  trivy:
    image: aquasec/trivy:0.74.0
    profiles:
      - scan
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - trivy-cache:/root/.cache/trivy
    command:
      - image
      - --scanners
      - vuln
      - --severity
      - HIGH,CRITICAL
      - --ignore-unfixed
      - --exit-code
      - "1"
      - caderneta:local

  # ---------------------------------------------------------------------
  # End-to-end smoke test, without touching the real Telegram. Run it with:
  #   docker compose --profile smoke up --abort-on-container-exit
  # ---------------------------------------------------------------------
  fake-telegram:
    image: caderneta:local
    profiles:
      - smoke
    entrypoint: ["python", "/app/scripts/fake_telegram.py"]
    volumes:
      - ./scripts/fake_telegram.py:/app/scripts/fake_telegram.py:ro
    ports:
      - "127.0.0.1:8081:8081"
    # It would inherit the image's HEALTHCHECK, which points at another port.
    healthcheck:
      disable: true

  bot-smoke:
    image: caderneta:local
    profiles:
      - smoke
    depends_on:
      - fake-telegram
    environment:
      BOT_TOKEN: "424242:smoke"
      OWNER_CHAT_ID: "12345"
      TELEGRAM_API_URL: "http://fake-telegram:8081"
      DB_PATH: /data/smoke.db
      HEALTH_PORT: "8080"
      TZ: America/Sao_Paulo
      LOG_LEVEL: INFO
    volumes:
      - smoke-data:/data
    ports:
      - "127.0.0.1:8082:8080"

volumes:
  caderneta-data:
  trivy-cache:
  smoke-data:
