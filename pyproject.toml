[project]
name = "caderneta"
version = "0.3.0"
description = "Bot de Telegram para controle financeiro pessoal"
requires-python = ">=3.11"
dependencies = [
    "aiogram>=3.13",
    "sqlalchemy>=2.0.35",
    "alembic>=1.13",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/caderneta"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
