name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGEM: ghcr.io/rafalg18/caderneta

jobs:
  qualidade:
    name: Tests and chart lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true

      - run: uv sync --frozen
      - run: uv run pytest -q

      # The chart resolves `image.tag: ""` to v<appVersion>, and CI only
      # publishes that tag from a git tag v*. If the two versions diverge, the
      # chart default points at an image that does not exist - that is how the
      # first deploy broke with ImagePullBackOff.
      - name: Tag v* matches the chart appVersion
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          app="$(grep '^appVersion:' helm/caderneta/Chart.yaml | cut -d: -f2 | tr -d ' "')"
          if [ "$tag" != "$app" ]; then
            echo "::error::git tag $GITHUB_REF_NAME does not match appVersion $app from Chart.yaml"
            exit 1
          fi
          echo "tag $GITHUB_REF_NAME == appVersion $app"

      - uses: azure/setup-helm@v5
      - run: helm lint helm/caderneta --set telegram.botToken=fake
      # Renders with the same combination deploy.sh uses: the chart guards fail
      # at template time, so this catches the error here and not in the cluster.
      - run: helm template caderneta helm/caderneta --set telegram.existingSecret=caderneta-token

  imagem:
    name: Build, scan and smoke
    runs-on: ubuntu-latest
    needs: qualidade
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5

      # Emulation to build arm64 on an amd64 runner.
      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v4

      # Native amd64 build, only for the scan and the smoke test: `load` does
      # not accept a multi-platform image, and running the tests under QEMU would
      # be slow for no gain.
      - uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: caderneta:local
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trivy (HIGH/CRITICAL with a fix available)
        run: docker compose --profile scan run --rm trivy

      - name: Smoke test end-to-end
        run: |
          docker compose --profile smoke up -d
          for _ in $(seq 30); do
            if curl -sf http://127.0.0.1:8081/_replies >/dev/null; then break; fi
            sleep 1
          done
          sleep 5
          curl -s http://127.0.0.1:8081/_replies | python3 -m json.tool

      - name: Smoke logs (only on failure)
        if: failure()
        run: docker compose --profile smoke logs

      - name: Tear down the smoke stack
        if: always()
        run: docker compose --profile smoke down -v

      # --------------------------------------------------------------------
      # Publishing: only on main and on tags. PRs do not publish - no reason to
      # spend registry space on a branch image that may never be merged.
      # --------------------------------------------------------------------
      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image tags
        if: github.event_name == 'push'
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGEM }}
          tags: |
            type=ref,event=branch
            type=semver,pattern=v{{version}}
            type=semver,pattern=v{{major}}.{{minor}}
            type=sha,format=long
            type=raw,value=latest,enable={{is_default_branch}}

      # Reuses the cache from the build above: no recompile, just a push.
      # Multi-platform: the cluster node may be arm64 (the pull fails with
      # "no match for platform in manifest" if the image is amd64 only).
      # provenance: false keeps the index clean - the attestation manifest shows
      # up as platform "unknown/unknown" and confuses older runtimes.
      - name: Push to GHCR
        if: github.event_name == 'push'
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          provenance: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Resumo
        if: github.event_name == 'push'
        run: |
          echo "### Imagem publicada" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "${{ steps.meta.outputs.tags }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
