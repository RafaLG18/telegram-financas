name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGEM: ghcr.io/rafalg18/caderneta

jobs:
  qualidade:
    name: Testes e lint do chart
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true

      - run: uv sync --frozen
      - run: uv run pytest -q

      # O chart resolve `image.tag: ""` para v<appVersion>, e o CI so publica
      # essa tag a partir de um git tag v*. Se as duas versoes divergirem, o
      # default do chart aponta pra uma imagem que nao existe — foi assim que
      # o primeiro deploy quebrou com ImagePullBackOff.
      - name: Tag v* bate com o appVersion do chart
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          app="$(grep '^appVersion:' helm/caderneta/Chart.yaml | cut -d: -f2 | tr -d ' "')"
          if [ "$tag" != "$app" ]; then
            echo "::error::git tag $GITHUB_REF_NAME nao bate com appVersion $app do Chart.yaml"
            exit 1
          fi
          echo "tag $GITHUB_REF_NAME == appVersion $app"

      - uses: azure/setup-helm@v5
      - run: helm lint helm/caderneta --set telegram.botToken=fake
      # Renderiza com a mesma combinacao que o deploy.sh usa: as guardas do
      # chart falham no template, entao isto pega o erro aqui e nao no cluster.
      - run: helm template caderneta helm/caderneta --set telegram.existingSecret=caderneta-token

  imagem:
    name: Build, scan e smoke
    runs-on: ubuntu-latest
    needs: qualidade
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5

      # Emulacao para buildar arm64 num runner amd64.
      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v4

      # Build nativo amd64, so pro scan e pro smoke: `load` nao aceita imagem
      # multi-plataforma, e rodar os testes sob QEMU seria lento sem ganho.
      - uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: caderneta:local
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trivy (HIGH/CRITICAL com correcao disponivel)
        run: docker compose --profile scan run --rm trivy

      - name: Smoke test end-to-end
        run: |
          docker compose --profile smoke up -d
          for _ in $(seq 30); do
            if curl -sf http://127.0.0.1:8081/_replies >/dev/null; then break; fi
            sleep 1
          done
          sleep 5
          curl -s http://127.0.0.1:8081/_replies | python3 -m json.tool

      - name: Logs do smoke (so quando falha)
        if: failure()
        run: docker compose --profile smoke logs

      - name: Derruba o smoke
        if: always()
        run: docker compose --profile smoke down -v

      # --------------------------------------------------------------------
      # Publicacao: so no main e em tag. PR nao publica — nao ha por que gastar
      # espaco no registry com imagem de branch que pode nem virar merge.
      # --------------------------------------------------------------------
      - name: Login no GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tags da imagem
        if: github.event_name == 'push'
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGEM }}
          tags: |
            type=ref,event=branch
            type=semver,pattern=v{{version}}
            type=semver,pattern=v{{major}}.{{minor}}
            type=sha,format=long
            type=raw,value=latest,enable={{is_default_branch}}

      # Reusa o cache do build acima: nao recompila, so empurra.
      # Multi-plataforma: o node do cluster pode ser arm64 (o pull falha com
      # "no match for platform in manifest" se a imagem for so amd64).
      # provenance: false mantem o indice limpo — o manifesto de atestacao
      # aparece como plataforma "unknown/unknown" e confunde runtime antigo.
      - name: Publica no GHCR
        if: github.event_name == 'push'
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          provenance: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Resumo
        if: github.event_name == 'push'
        run: |
          echo "### Imagem publicada" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "${{ steps.meta.outputs.tags }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
